<script>
(function () {
  'use strict';

  /* ================= yardımcılar ================= */
  var $ = function (id) { return document.getElementById(id); };
  var NF0 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
  var NF2 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var NFC = new Intl.NumberFormat('tr-TR', { notation: 'compact', maximumFractionDigits: 1 });
  var CUR_SYM = { USD: '$', EUR: '€', TRY: '₺', GBP: '£' };
  function SYM() { return (typeof BOOT !== 'undefined' && BOOT && BOOT.ok && BOOT.data && BOOT.data.curSym) || '$'; }
  function bad(v) { return v == null || v === '' || (typeof v === 'number' && !isFinite(v)); }
  function fmt(v, u) {
    if (bad(v)) return '–';
    if (typeof v !== 'number') return esc(v);
    switch (u) {
      case 'usd': return SYM() + NF2.format(v);
      case 'money': return NF2.format(v);
      case 'int': return NF0.format(v);
      case 'num': return Math.abs(v) >= 100 ? NF0.format(v) : NF2.format(v);
      case 'pct': return NF2.format(v * 100) + '%';
      case 'x': return NF2.format(v);
      default: return NF2.format(v);
    }
  }
  function fmtCur(v, cur) {
    if (bad(v)) return '–';
    var c = String(cur || '').toUpperCase(), sym = CUR_SYM[c];
    return sym ? sym + NF2.format(v) : (c ? c + ' ' : '') + NF2.format(v);
  }
  function fmtShort(v, u) {
    if (bad(v)) return '';
    if (u === 'pct') return NF2.format(v * 100) + '%';
    if (u === 'x') return NF2.format(v);
    return (u === 'usd' ? SYM() : '') + NFC.format(v);
  }
  /** Kart için kısa biçim: büyük tutarlarda ondalık atılır, milyonlar "Mn" ile gösterilir (tam değer ipucunda). */
  function kpiFmt(v, u) {
    if (bad(v) || typeof v !== 'number') return fmt(v, u);
    var a = Math.abs(v);
    if (u === 'usd' || u === 'money') {
      var pre = u === 'usd' ? SYM() : '';
      if (a >= 1e6) return pre + NF2.format(v / 1e6) + ' Mn';
      if (a >= 1e4) return pre + NF0.format(v);
      return pre + NF2.format(v);
    }
    if (u === 'int' || u === 'num') return a >= 1e7 ? NF2.format(v / 1e6) + ' Mn' : NF0.format(v);
    return fmt(v, u);
  }
  /** Hâlâ sığmayan değerlerde yazıyı karta sığana kadar küçült. */
  function fitKpis(el) {
    el.querySelectorAll('.kpi .v').forEach(function (d) {
      var fs = 20;
      d.style.fontSize = '';
      while (d.scrollWidth > d.clientWidth && fs > 13) { fs -= 1; d.style.fontSize = fs + 'px'; }
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function addDays(s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- yükleniyor göstergesi: önce ekranın ortasında, ~1.2 sn sonra sağ alta ---------- */
  var busyN = 0, busyT = null;
  function busy(on, txt) {
    busyN += on ? 1 : -1; if (busyN < 0) busyN = 0;
    var el = $('busy');
    if (txt) $('busyTxt').textContent = txt;
    if (busyN > 0 && el.classList.contains('hidden')) {
      el.classList.remove('hidden', 'corner'); el.classList.add('center');
      clearTimeout(busyT);
      busyT = setTimeout(function () { el.classList.remove('center'); el.classList.add('corner'); }, 1200);
    }
    if (busyN === 0) { clearTimeout(busyT); el.classList.add('hidden'); el.classList.remove('center', 'corner'); }
  }
  var toastT;
  function toast(html, ms) {
    var t = $('toast'); t.innerHTML = html; t.classList.remove('hidden');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add('hidden'); }, ms || 5000);
  }
  var GUEST_KEY = (function () { try { return new URLSearchParams(location.search).get('k') || ''; } catch (e) { return ''; } })() || (window.__GK || '');
  function call(fn, arg, txt, quiet) {
    if (!quiet) busy(true, txt || 'Veriler yükleniyor…');
    return new Promise(function (res, rej) {
      var r = google.script.run
        .withSuccessHandler(function (s) {
          if (!quiet) busy(false);
          var o; try { o = JSON.parse(s); } catch (e) { return rej(new Error('Yanıt okunamadı')); }
          o.ok ? res(o.data) : rej(new Error(o.error));
        })
        .withFailureHandler(function (e) { if (!quiet) busy(false); rej(e); });
      r[fn](arg === undefined ? null : arg, GUEST_KEY || window.__GK || '');
    });
  }
  function fail(e) { toast('⚠ ' + esc(e.message || e), 9000); }

  /* ================= durum ================= */
  var B = null;
  var S = {
    tab: 'ads', from: '', to: '',
    f: { platforms: [], countries: [], accounts: [], kinds: ['ecom'], campInc: { terms: [], mode: 'or' }, campExc: { terms: [], mode: 'or' } },
    ads: { level: 'country', grain: 'none', drill: [], pick: null, mf: [], view: null, res: null, sort: null, page: 0, ids: false, sel: {}, lastSel: null,
      groups: { ga4: false, adj: false } },
    trend: { grain: 'week', metrics: ['spend_usd'], brk: 'none', mode: 'multi', res: null }
  };
  var LEVEL_ORDER = ['total', 'country', 'platform', 'account', 'campaign', 'adgroup', 'ad'];
  var LEVEL_LABELS = { total: 'Toplam', country: 'Ülke', platform: 'Mecra', account: 'Hesap', campaign: 'Kampanya', adgroup: 'Ad group / Ad set', ad: 'Ad' };
  var GRAINS = [['none', 'Dönemsiz'], ['day', 'Günlük'], ['week', 'Haftalık'], ['month', 'Aylık']];
  var GROUPS = [['ga4', 'GA4 Web'], ['adj', 'Adjust']];
  // Varsayılan kolon sırası (Görünüm ile kişi başına değiştirilebilir)
  var DEFAULT_COLS = ['spend_usd', 'roas', 'margin', 'cohort_roas', 'cpi', 'cps', 'tot_purchases', 'tot_revenue_usd',
    'coh_purchases', 'coh_revenue_usd', 'tot_installs', 'cpc', 'ctr', 'tot_sessions', 'clicks', 'impressions'];
  var GROUP_COLS = { ga4: ['ga_sessions', 'ga_purchases', 'ga_revenue_usd'], adj: ['adj_sessions', 'adj_purchases', 'adj_revenue_usd', 'adj_installs', 'adj_c_purchases', 'adj_c_revenue_usd'] };
  var TOT_SHORT = { tot_sessions: 'Sessions', tot_purchases: 'Purchase', tot_revenue_usd: 'Revenue', tot_installs: 'Installs' };
  var DIM_ALL = [['platform', 'Mecra'], ['country', 'Ülke'], ['tip', 'Tip'], ['account_name', 'Hesap'], ['account_id', 'Hesap ID'], ['campaign_name', 'Kampanya'], ['campaign_id', 'Kampanya ID'],
    ['adgroup_name', 'Ad group / Ad set'], ['adgroup_id', 'Ad group ID'], ['ad_name', 'Ad'], ['ad_id', 'Ad ID'], ['ad_type', 'Ad tipi']];
  var VIEW = { cols: DEFAULT_COLS.slice(), dims: {}, custom: [], kpis: {}, charts: {}, kcustom: {} }, VIEWS = [], VIEW_NAME = '', VIEW_ITEM = null, VIEW_ID = '', REPORT_URL = '', REPORT_GUEST = '';
  var SERIES = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function div(a, b) { return b ? a / b : null; }
  function sum(a, b) { return (a || 0) + (b || 0); }
  var DERIVED = {
    roas: function (m) { return div(sum(m.ga_revenue_usd, m.adj_revenue_usd), m.spend_usd); },
    margin: function (m) { return div(m.spend_usd, sum(m.ga_revenue_usd, m.adj_revenue_usd)); },
    cohort_roas: function (m) { return div(sum(m.ga_revenue_usd, m.adj_c_revenue_usd), m.spend_usd); },
    coh_purchases: function (m) { return sum(m.ga_purchases, m.adj_c_purchases); },
    coh_revenue_usd: function (m) { return sum(m.ga_revenue_usd, m.adj_c_revenue_usd); },
    cpi: function (m) { return div(m.spend_usd, m.adj_installs); },
    cps: function (m) { return div(m.spend_usd, sum(m.ga_sessions, m.adj_sessions)); },
    cpc: function (m) { return div(m.spend_usd, m.clicks); },
    ctr: function (m) { return div(m.clicks, m.impressions); },
    cost_per_install: function (m) { return div(m.spend_usd, m.installs); },
    tot_sessions: function (m) { return sum(m.ga_sessions, m.adj_sessions); },
    tot_purchases: function (m) { return sum(m.ga_purchases, m.adj_purchases); },
    tot_revenue_usd: function (m) { return sum(m.ga_revenue_usd, m.adj_revenue_usd); },
    tot_installs: function (m) { return m.adj_installs || 0; }
  };

  /* ================= istemci önbelleği + arka planda ön yükleme ================= */
  /* ================= dönem karşılaştırma ================= */
  var CMP = { on: false, mode: 'prev', from: '', to: '' };
  function cmpPrev() { var n = daysSel(), to = addDays(S.from, -1); return { from: addDays(to, -(n - 1)), to: to }; }
  function cmpYago(d) { var y = (+d.slice(0, 4) - 1) + d.slice(4); return y.slice(5) === '02-29' ? y.slice(0, 5) + '02-28' : y; }
  function cmpRange() {
    if (!CMP.on || !S.from || !S.to) return null;
    if (CMP.mode === 'yoy') return { from: cmpYago(S.from), to: cmpYago(S.to) };
    if (CMP.mode === 'custom') return CMP.from && CMP.to && CMP.from <= CMP.to ? { from: CMP.from, to: CMP.to } : null;
    return cmpPrev();
  }
  function cmpParam() { var r = cmpRange(); return r ? { from: r.from, to: r.to } : undefined; }
  function cmpD(d) { return d.split('-').reverse().join('.'); }
  function cmpLabel() { var r = cmpRange(); return r ? cmpD(r.from) + ' – ' + cmpD(r.to) : 'Önceki dönem'; }
  function cmpInv(c) { return !!c.inv || /^(cpc|cpm|cpa|cpi|cps|cpv|cost_per|margin|uninstall|bounce)/i.test(c.k); }
  function cmpNeu(c) { return !!c.neu || /^(spend|spend_usd|cost)$/.test(c.k); }
  /** Satır → karşılaştırma anahtarı: kırılım kolonları; dönem kolonu varsa sıra numarasıyla eşlenir (1. hafta ↔ 1. hafta). */
  function cmpKeyer(res) {
    var tix = [], pix = -1, pord = {};
    res.columns.forEach(function (c, i) { if (c.k === 'period') pix = i; else if (c.t === 'text') tix.push(i); });
    if (pix >= 0) { var ps = {}; res.rows.forEach(function (r) { ps[r[pix]] = 1; }); Object.keys(ps).sort().forEach(function (p, i) { pord[p] = i; }); }
    return function (r) { return (pix >= 0 ? pord[r[pix]] + '|' : '') + tix.map(function (i) { return r[i]; }).join('|'); };
  }
  function cmpMap(res) {
    if (!CMP.on || !res || !res.cmp || !res.cmp.rows) return null;
    if (res._cm) return res._cm;
    var kc = cmpKeyer(res.cmp), m = {};
    res.cmp.rows.forEach(function (r) { m[kc(r)] = r; });
    return (res._cm = { m: m, k: cmpKeyer(res) });
  }
  function cmpCell(v, p, c) {
    if (p == null || bad(v) || bad(p) || !p) return '';
    var d = (v - p) / Math.abs(p), a = Math.abs(d) * 100, cls = '';
    if (Math.abs(d) >= 0.005 && !cmpNeu(c)) cls = (d > 0) !== cmpInv(c) ? ' pos' : ' neg';
    return '<div class="cd' + cls + '" title="' + esc(cmpLabel() + ': ' + fmt(p, c.t)) + '">' + (d >= 0 ? '▲ ' : '▼ ') + (a < 10 ? a.toFixed(1).replace('.', ',') : NF0.format(Math.round(a))) + '%</div>';
  }
  function cmpUi() {
    var r = cmpRange();
    $('cmpOn').checked = CMP.on; $('cmpMode').value = CMP.mode;
    $('cmpMode').classList.toggle('hidden', !CMP.on);
    $('cmpCustom').classList.toggle('hidden', !(CMP.on && CMP.mode === 'custom'));
    $('cmpFrom').value = CMP.from || ''; $('cmpTo').value = CMP.to || '';
    $('cmpLbl').textContent = CMP.on && r && CMP.mode !== 'custom' ? 'vs ' + cmpLabel() : '';
    if (B && B.startDate && r && r.from < B.startDate) $('cmpLbl').textContent += ' (veri ' + cmpD(B.startDate) + '\'den itibaren)';
  }
  function initCmp() {
    if (B.startDate) $('cmpFrom').min = $('cmpTo').min = B.startDate;
    if (B.dataEnd) $('cmpFrom').max = $('cmpTo').max = B.dataEnd;
    $('cmpOn').onchange = function () { CMP.on = this.checked; cmpUi(); applyFilters(); };
    $('cmpMode').onchange = function () {
      CMP.mode = this.value;
      if (CMP.mode === 'custom' && !(CMP.from && CMP.to)) { var r = cmpPrev(); CMP.from = r.from; CMP.to = r.to; }
      cmpUi(); applyFilters();
    };
    var cust = function () { CMP.from = $('cmpFrom').value; CMP.to = $('cmpTo').value; if (CMP.from && CMP.to && CMP.from > CMP.to) return toast('Karşılaştırma başlangıcı bitişten sonra olamaz'); cmpUi(); scheduleApply(300); };
    $('cmpFrom').onchange = cust; $('cmpTo').onchange = cust;
    cmpUi();
  }
  var QC = {};            // params-json → sonuç
  var inflight = {};      // params-json → Promise
  function qkey(p) { return JSON.stringify(p); }
  function fetchQuery(p, quiet) {
    var k = qkey(p);
    if (QC[k]) return Promise.resolve(QC[k]);
    if (inflight[k]) {
      if (!quiet) { busy(true); return inflight[k].then(function (r) { busy(false); return r; }, function (e) { busy(false); throw e; }); }
      return inflight[k];
    }
    var pr = call('apiQuery', k, 'Veriler yükleniyor…', quiet).then(function (res) { QC[k] = res; delete inflight[k]; return res; },
      function (e) { delete inflight[k]; throw e; });
    inflight[k] = pr;
    return pr;
  }
  /** Tam eşleşen sonuç yoksa: aynı seviyenin filtresiz (detaysız) sonucundan satır süzerek anında üret. */
  function deriveFromBase(baseP, preds) {
    var base = QC[qkey(baseP)];
    if (!base) return null;
    var idx = {}; base.columns.forEach(function (c, i) { idx[c.k] = i; });
    if (!preds.every(function (pr) { return idx[pr.col] != null; })) return null;
    var rows = base.rows.filter(function (r) { return preds.every(function (pr) { return String(r[idx[pr.col]]) === String(pr.v); }); });
    var out = {}; for (var k in base) out[k] = base[k];
    out.rows = rows;
    out.totals = totalsFor(base, rows, true);
    if (base.cmp && base.cmp.columns) {
      var crows = base.cmp.rows.filter(function (r) { return preds.every(function (pr) { return String(r[idx[pr.col]]) === String(pr.v); }); });
      out.cmp = { from: base.cmp.from, to: base.cmp.to, columns: base.cmp.columns, rows: crows, totals: totalsFor(base.cmp, crows, true) };
    }
    out.unmatched = [];
    return out;
  }
  /** Satır alt kümesi için toplam satırı (toplanabilirler toplanır, türetilmişler yeniden hesaplanır). */
  function totalsFor(res, rows, metricOnly) {
    if (!res.totals) return null;
    var off = res.columns.length - res.totals.length;
    var m = {}, curIdx = -1;
    res.columns.forEach(function (c, i) {
      if (c.k === '_cur') curIdx = i;
      if (c.t === 'text' || c.t === 'hidden' || c.d) return;
      m[c.k] = rows.reduce(function (a, r) { return a + (+r[i] || 0); }, 0);
    });
    var curs = {};
    if (curIdx >= 0) rows.forEach(function (r) { curs[r[curIdx]] = 1; });
    var one = Object.keys(curs).length === 1 ? Object.keys(curs)[0] : '';
    var t = res.columns.map(function (c) {
      if (c.k === '_cur') return one;
      if (c.t === 'text') return '';
      if (c.orig && !one) return null;
      return c.d ? (DERIVED[c.k] ? DERIVED[c.k](m) : null) : m[c.k];
    });
    return metricOnly ? t.slice(off) : t;
  }

  function baseParams(level, grain) {
    return { source: 'ads', from: S.from, to: S.to, level: level, grain: grain, cmp: cmpParam(),
      filters: { platforms: S.f.platforms.slice(), countries: S.f.countries.slice(), accounts: S.f.accounts.slice(), kinds: S.f.kinds.slice(), campInc: termsRegex(S.f.campInc, false), campExc: termsRegex(S.f.campExc, true), eq: {},
        pick: S.ads.pick ? { fields: S.ads.pick.fields, keys: S.ads.pick.keys } : null },
      dims: VIEW.dims[level] && VIEW.dims[level].length ? VIEW.dims[level].slice() : undefined };
  }
  function drillPreds() {
    var pr = [];
    S.ads.drill.forEach(function (d) {
      if (d.country) pr.push({ col: 'country', v: d.country });
      if (d.platform) pr.push({ col: 'platform', v: d.platform });
      if (d.field) pr.push({ col: d.field, v: d.value });
    });
    return pr;
  }
  function drillParams(level, grain) {
    var p = baseParams(level, grain);
    S.ads.drill.forEach(function (d) {
      if (d.platform) p.filters.platforms = [d.platform];
      if (d.country) p.filters.countries = [d.country];
      if (d.field) p.filters.eq[d.field] = d.value;
    });
    return p;
  }
  function daysSel() { return Math.round((Date.parse(S.to) - Date.parse(S.from)) / 864e5) + 1; }

  var prefetchQ = [], prefetching = false;
  function schedulePrefetch() {
    var g = S.ads.grain;
    var lv = ['campaign', 'country', 'platform', 'account', 'total'].filter(function (l) { return LEVEL_ORDER.indexOf(l) >= 0; });
    if (daysSel() <= B.adMaxDays) lv.push('adgroup');
    prefetchQ = lv.map(function (l) { return baseParams(l, g); });
    // trend kırılımları (açıksa)
    if ($('trendBox').open) ['total', 'country', 'platform'].filter(function (l) { return LEVEL_ORDER.indexOf(l) >= 0; }).forEach(function (l) { prefetchQ.push(baseParams(l, S.trend.grain)); });
    runPrefetch();
  }
  function runPrefetch() {
    if (prefetching) return;
    var p = prefetchQ.shift();
    if (!p) return;
    if (QC[qkey(p)]) return runPrefetch();
    prefetching = true;
    fetchQuery(p, true).then(function () { prefetching = false; setTimeout(runPrefetch, 50); },
      function () { prefetching = false; setTimeout(runPrefetch, 50); });
  }

  /* ================= kontroller ================= */
  function seg(el, items, cur, onPick) {
    el.innerHTML = items.map(function (it) {
      return '<button data-v="' + it[0] + '"' + (it[0] === cur ? ' class="on"' : '') + '>' + it[1] + '</button>';
    }).join('');
    el.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call(el.children, function (x) { x.classList.toggle('on', x === b); });
      onPick(b.getAttribute('data-v'));
    };
  }
  function multi(el, items, selected, onChange, search) {
    var sel = {}; selected.forEach(function (k) { sel[k] = 1; });
    function summary() {
      var keys = Object.keys(sel);
      if (!keys.length) return 'Tümü';
      if (keys.length === 1) { var it = items.filter(function (i) { return i.k === keys[0]; })[0]; return it ? it.l : keys[0]; }
      return keys.length + ' seçili';
    }
    el.innerHTML = '<details class="ms"><summary></summary><div class="dd"><div class="ms-actions"><button data-a="none">Temizle</button></div>' +
      (search ? '<input type="text" class="ms-search" placeholder="Ara…">' : '') +
      '<div class="ms-list">' + items.map(function (i) {
        return '<label data-t="' + esc((i.l + ' ' + (i.s || '')).toLowerCase()) + '"><input type="checkbox" value="' + esc(i.k) + '"' + (sel[i.k] ? ' checked' : '') + '> ' + esc(i.l) + (i.s ? ' <span class="muted small">' + esc(i.s) + '</span>' : '') + '</label>';
      }).join('') + '</div></div></details>';
    var sm = el.querySelector('summary'); sm.textContent = summary();
    el.querySelector('.ms-list').onchange = function (e) {
      if (e.target.checked) sel[e.target.value] = 1; else delete sel[e.target.value];
      sm.textContent = summary(); onChange(Object.keys(sel));
    };
    el.querySelector('.ms-actions').onclick = function (e) {
      if (!e.target.getAttribute('data-a')) return;
      e.preventDefault(); sel = {};
      el.querySelectorAll('.ms-list input').forEach(function (c) { c.checked = false; });
      sm.textContent = summary(); onChange([]);
    };
    var s = el.querySelector('.ms-search');
    if (s) s.oninput = function () {
      var q = s.value.toLowerCase();
      el.querySelectorAll('.ms-list label').forEach(function (l) { l.style.display = l.getAttribute('data-t').indexOf(q) >= 0 ? '' : 'none'; });
    };
  }
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.ms[open]').forEach(function (d) { if (!d.contains(e.target)) d.removeAttribute('open'); });
  });

  /* ================= birleşik filtre çubuğu (Meta / Google Ads tarzı) ================= */
  var FDEFS = [
    { k: 'countries', l: 'Ülke', type: 'multi', search: true, items: function () { return B.countries.map(function (c) { return { k: c.code, l: c.name, s: c.code }; }); } },
    { k: 'platforms', l: 'Mecra', type: 'multi', items: function () { return (B.platforms || ['Google Ads', 'Meta']).map(function (p) { return { k: p, l: p }; }); } },
    { k: 'accounts', l: 'Hesap', type: 'multi', search: true, items: function () {
      return B.accounts.filter(function (a) {
        return (!S.f.platforms.length || S.f.platforms.indexOf(a.platform) >= 0) && (!S.f.countries.length || S.f.countries.indexOf(a.code) >= 0);
      }).map(function (a) { return { k: a.key, l: a.name, s: ({ 'Google Ads': 'GAds', 'Microsoft Ads': 'Bing', 'Yandex Direct': 'Yandex' }[a.platform] || a.platform) + ' · ' + a.code }; });
    } },

  /* ================= metrik filtresi (Meta / Google Ads tarzı) ================= */
  var MF_OPS = [['gt', '>'], ['gte', '≥'], ['lt', '<'], ['lte', '≤'], ['eq', '='], ['between', 'arasında']];
  function mfCols(res) {
    return (res ? res.columns : B.ads.metrics.map(function (m) { return { k: m.k, l: m.l, t: m.u }; }))
      .filter(function (c) { return c.t !== 'text' && c.t !== 'hidden' && !c.orig; });
  }
  function mfScale(t) { return t === 'pct' ? 0.01 : 1; } // CTR % olarak girilir
  function mfTest(v, f, t) {
    if (v == null || !isFinite(v)) return false;
    var a = f.v * mfScale(t), b = f.v2 * mfScale(t), eps = 1e-9;
    switch (f.op) {
      case 'gt': return v > a; case 'gte': return v >= a - eps; case 'lt': return v < a; case 'lte': return v <= a + eps;
      case 'eq': return Math.abs(v - a) <= Math.max(eps, Math.abs(a) * 0.005);
      case 'between': return v >= Math.min(a, b) - eps && v <= Math.max(a, b) + eps;
    }
    return true;
  }
  function mfApply(res) {
    if (!res || !S.ads.mf.length) return res;
    var idx = {}; res.columns.forEach(function (c, i) { idx[c.k] = i; });
    var fs = S.ads.mf.filter(function (f) { return idx[f.k] != null; });
    if (!fs.length) return res;
    var rows = res.rows.filter(function (r) { return fs.every(function (f) { return mfTest(r[idx[f.k]], f, res.columns[idx[f.k]].t); }); });
    var out = {}; for (var k in res) out[k] = res[k];
    out.rows = rows;
    out.totals = totalsFor(res, rows, true);
    if (res.cmp && res.cmp.columns) {
      var kc = cmpKeyer(res), keep = {}; rows.forEach(function (r) { keep[kc(r)] = 1; });
      var kc2 = cmpKeyer(res.cmp), crows = res.cmp.rows.filter(function (r) { return keep[kc2(r)]; });
      out.cmp = { from: res.cmp.from, to: res.cmp.to, columns: res.cmp.columns, rows: crows, totals: totalsFor(res.cmp, crows, true) };
    }
    return out;
  }
  function mfLabel(f) {

    var u = c.t === 'pct' ? '%' : '';
    var op = MF_OPS.filter(function (o) { return o[0] === f.op; })[0][1];
    return c.l + ' ' + (f.op === 'between' ? NF2.format(f.v) + u + ' – ' + NF2.format(f.v2) + u : op + ' ' + NF2.format(f.v) + u);
  }

  function trendData() {
    var res = S.trend.res; if (!res) return null;
    var idx = {}; res.columns.forEach(function (c, i) { idx[c.k] = i; });
    var textCols = res.columns.filter(function (c) { return c.t === 'text' && c.k !== 'period'; });
    var labCols = textCols.filter(function (c) { return !/_id$/.test(c.k); });
    var keyCols = textCols.map(function (c) { return idx[c.k]; });
    var periods = [], pset = {}, ser = {}, order = [];
    res.rows.forEach(function (r) {
      var per = r[idx.period];
      if (!pset[per]) { pset[per] = 1; periods.push(per); }
      var key = keyCols.map(function (i) { return r[i]; }).join(' · ') || 'Toplam';
      var s = ser[key];
      if (!s) {
        var lab = labCols.map(function (c) { var v = r[idx[c.k]]; return c.k === 'country' ? countryName(v) : v; }).join(' · ') || 'Toplam';

      }

      s.rank += +r[idx.spend_usd] || 0;
    });
    periods.sort();
    var list = order.map(function (k) { return ser[k]; }).sort(function (a, b) { return b.rank - a.rank; });

  function drawTrend() {

    var cat = {}; d.cols.forEach(function (c) { cat[c.k] = c; });

        },

      FDEFS = FDEFS.filter(function (d) { return d.k !== 'countries'; });
      PICK_FIELDS.platform = ['platform'];
      if (S.ads.level === 'country') S.ads.level = 'platform';
    }
    // Kampanya grubu filtresi (Brand.js > CAMPAIGN_GROUP): yoksa filtre gizlenir
    if (!B.campaignGroup) { FDEFS = FDEFS.filter(function (d) { return d.k !== 'kinds'; }); S.f.kinds = []; }
    else S.f.kinds = B.campaignGroup.def === 'in' ? ['ecom'] : B.campaignGroup.def === 'out' ? ['kurumsal'] : [];
    $('app').classList.remove('hidden');
    preset('30');
    $('fFrom').min = $('fTo').min = B.startDate;
    $('fFrom').max = $('fTo').max = B.dataEnd;
    var hh = ('0' + (B.refreshHour || 0)).slice(-2) + ':00';
    $('dataNote').textContent = 'ⓘ Bugünün verisini içermez · her gece ' + hh + ' sonrası güncellenir';
    $('dataNote').title = 'Veriler bugünü içermez; her gece ' + hh + ' sonrası dün dahil güncellenir.';
    if (B.lastUpdate) $('dataNote').title += ' Son güncelleme: ' + B.lastUpdate.slice(0, 16) + '.';
    $('fFrom').onchange = function () { S.from = this.value; scheduleApply(300); };
    $('fTo').onchange = function () { S.to = this.value; scheduleApply(300); };
    $('fPreset').onchange = function () { if (this.value) { preset(this.value); this.value = ''; applyFilters(); } };
    $('btnApply').onclick = applyFilters; initCmp(); loadTargets();
    initAds(); initApp(); initWeb(); initCreative(); initCpas(); initTrend(); initStatus(); initFeedback();
    $('tabs').onclick = function (e) { var t = e.target.closest('button'); if (t) showTab(t.getAttribute('data-tab')); };
    showTab('ads');
    skeleton();
    drawFilterBar();
    loadAds();
  }

  // Bootstrap sayfaya gömülü gelir (ekstra istek yok); yoksa sunucudan istenir
  if (typeof BOOT === 'object' && BOOT && BOOT.ok) start(BOOT.data);
  else { $('app').classList.remove('hidden'); skeleton(); call('apiBootstrap').then(start).catch(fail); }
})();
</script>
